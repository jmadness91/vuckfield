[project]
name = "vuckfield"
version = "0.1.0"
description = "Public geodata -> Unreal-ready assets for the Vuckfield world"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "requests>=2.31",
  "shapely>=2.0",
  "trimesh>=4.0",
  "mapbox_earcut>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
